name: Build Windows App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore WindowsApp/AIWidgetWindowsApp/AIWidgetWindowsApp.csproj

    - name: Build and Publish
      run: dotnet publish WindowsApp/AIWidgetWindowsApp/AIWidgetWindowsApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIWidgetWindowsApp-exe
        path: publish/AIWidgetWindowsApp.exe
